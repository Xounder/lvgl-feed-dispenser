; ESP32-S3 (SpotPear 4.3" 800x480 RGB + GT911)
; Referencia: .docs/11-migration-pc-to-esp32/
; Valores de placa/memoria provisorios; validar com o fabricante.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

lib_deps =
    bogde/HX711@^0.7.6
    madhephaestus/ESP32Servo@^3.0.0

; LVGL vendido em ./lvgl (submodulo, v9.5.0)
lib_extra_dirs =
    ${PROJECT_DIR}

; Somente o codigo compartilhado + plataforma ESP32.
; Exclui o entry PC (main.c), SDL/HAL e o hardware simulado.
src_filter =
    -<main.c>
    -<freertos_main.c>
    -<mouse_cursor_icon.c>
    -<hal>
    -<hardware/simulated>

build_flags =
    -DLV_CONF_PATH="\"config/lv_conf_esp32.h\""
    -I${PROJECT_DIR}